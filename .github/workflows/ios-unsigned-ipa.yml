name: iOS unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate

      - name: Build for generic iOS device without signing
        working-directory: iOS
        run: |
          xcodebuild \
            -project Cairn.xcodeproj \
            -scheme Cairn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            build

      - name: Package unsigned IPA
        working-directory: iOS
        run: |
          mkdir -p build/ipa/Payload
          ditto build/Build/Products/Release-iphoneos/Cairn.app build/ipa/Payload/Cairn.app
          cd build/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload ../Cairn-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-unsigned-ipa
          path: iOS/build/Cairn-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
